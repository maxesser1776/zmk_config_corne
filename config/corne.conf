# --- Power management tuning ---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Make BLE links recover more gracefully after idle
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=500

# Send connection-parameter requests as L2CAP Connection Parameter Update
# Requests instead of the LL Connection Parameter Request procedure. The
# laptop's Intel AX201 sometimes accepts the LL request but never applies it,
# so the keyboard dropped the link 45 s after each (re)connect (reason 0x22 on
# the keyboard, 0x08 on the host). Through L2CAP, Windows applies the change
# itself, and it completes. Diagnosed 2026-11-18 (branch keypeek-stack-experiment).
# Do NOT use CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n instead: that build hung.
CONFIG_BT_CTLR_CONN_PARAM_REQ=n

# Make Bluetooth stronger
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# Enable mouse pointer
CONFIG_ZMK_POINTING=y

# KeyPeek module is pulled in via west.yml; keep it off in normal builds.
# The corne_left_keypeek build in build.yaml turns it (and Studio) on.
CONFIG_ZMK_KEYPEEK_LAYER_NOTIFIER=n
