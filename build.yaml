# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view
  - board: nice_nano_v2
    shield: settings_reset
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view
    snippet: zmk-usb-logging
    artifact-name: corne_left_debug
  # KeyPeek experiment: live layer overlay. Central (left) half only; right half unchanged.
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view raw_hid_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_KEYPEEK_LAYER_NOTIFIER=y
    artifact-name: corne_left_keypeek
  # Experiment (keypeek-stack-experiment): same KeyPeek build, system workqueue stack 2048 -> 4096.
  # Tests whether Raw HID sends from key handling overflow the stack and reset the left half (BLE drops, reason 0x08).
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view raw_hid_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_KEYPEEK_LAYER_NOTIFIER=y -DCONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
    artifact-name: corne_left_keypeek_bigstack
  # Experiment: KeyPeek build + USB logging, to see the keyboard's side of the drops (disconnect reason, le_param_updated).
  # zmk-usb-logging replaces the studio-rpc-usb-uart snippet (only one snippet per build entry); Studio still works over
  # BLE and over Raw HID. ZMK_BEHAVIORS_KEEP_ALL comes from the Studio snippet and is passed by hand here.
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view raw_hid_adapter
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_KEYPEEK_LAYER_NOTIFIER=y -DDTS_EXTRA_CPPFLAGS=-DZMK_BEHAVIORS_KEEP_ALL
    artifact-name: corne_left_keypeek_debug
  # Fix candidate: KeyPeek build where Studio does NOT ask the host for latency 10 while connected
  # (ZMK only requests it when STUDIO_TRANSPORT_BLE_PREF_LATENCY < BT_PERIPHERAL_PREF_LATENCY = 30).
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view raw_hid_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_KEYPEEK_LAYER_NOTIFIER=y -DCONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=30
    artifact-name: corne_left_keypeek_lat30
  # Fix candidate 2: lat30 + no automatic connection-parameter request after connecting.
  # Zephyr sends an LL Connection Parameter Request 5 s after EVERY connection, even when the params already match;
  # when the Intel AX201 never completes it, the keyboard drops the link 40 s later (reason 0x22) and the cycle repeats.
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view raw_hid_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_KEYPEEK_LAYER_NOTIFIER=y -DCONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=30 -DCONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
    artifact-name: corne_left_keypeek_noparam
